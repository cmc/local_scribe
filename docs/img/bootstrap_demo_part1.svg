<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 763 532" width="763" height="532" font-family="ui-monospace, 'SF Mono', Menlo, Monaco, 'Cascadia Mono', monospace" font-size="13px" role="img" aria-label="local_scribe • bootstrap (1/2)">
