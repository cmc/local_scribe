<text x="381" y="18" text-anchor="middle" fill="#8b949e" font-size="11px">local_scribe • bootstrap (1/2)</text>
<g opacity="0"><set attributeName="opacity" to="1" begin="0.000s" fill="freeze"/><text y="55"><tspan x="16.0" xml:space="preserve" fill="#79c0ff">operator@MacBook</tspan><tspan xml:space="preserve" fill="#e6edf3"> </tspan><tspan xml:space="preserve" fill="#8b949e">whisper_server</tspan><tspan xml:space="preserve" fill="#e6edf3"> </tspan><tspan xml:space="preserve" fill="#7ee787">%</tspan><tspan xml:space="preserve" fill="#e6edf3"> </tspan><tspan xml:space="preserve" fill="#ffffff">./run.sh bootstrap</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.700s" fill="freeze"/><text y="89"><tspan x="16.0" xml:space="preserve" fill="#ffffff">bootstrap</tspan><tspan xml:space="preserve" fill="#e6edf3"> — first-time setup for a fresh clone</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="1.800s" fill="freeze"/><text y="123"><tspan x="16.0" xml:space="preserve" fill="#ffffff">(1/10) python venv + pip deps + Touch ID helper</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="2.400s" fill="freeze"/><text y="140"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  creating venv at </tspan><tspan xml:space="preserve" fill="#79c0ff">./venv</tspan><tspan xml:space="preserve" fill="#e6edf3"> ...</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="2.900s" fill="freeze"/><text y="157"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  installing pinned dependencies (44 packages) ...</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="3.500s" fill="freeze"/><text y="174"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  building </tspan><tspan xml:space="preserve" fill="#79c0ff">bin/touchid_keychain</tspan><tspan xml:space="preserve" fill="#e6edf3"> (Swift helper) ...</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="3.800s" fill="freeze"/><text y="191"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#7ee787">✓ venv + deps ready</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="4.300s" fill="freeze"/><text y="208"><tspan x="16.0" xml:space="preserve" fill="#ffffff">(2/10) key-management tools (age, age-plugin-yubikey, ykman)</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="4.900s" fill="freeze"/><text y="225"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#7ee787">✓ age 1.2.0 present</tspan><tspan xml:space="preserve" fill="#e6edf3">   (≥ 1.1.0 required for YubiKey recipients)</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="5.300s" fill="freeze"/><text y="242"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#7ee787">✓ age-plugin-yubikey 0.5.0 present</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="5.700s" fill="freeze"/><text y="259"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#7ee787">✓ ykman 5.5.1 present</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="6.300s" fill="freeze"/><text y="276"><tspan x="16.0" xml:space="preserve" fill="#ffffff">(3/10) master key (Option C split-key: Touch ID ⊕ YubiKey)</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="6.700s" fill="freeze"/><text y="293"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  Generating a 256-bit master key, splitting it via XOR, then:</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="7.000s" fill="freeze"/><text y="310"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">    </tspan><tspan xml:space="preserve" fill="#a5d6ff">kc_half</tspan><tspan xml:space="preserve" fill="#e6edf3">  →  macOS Keychain (Touch ID-gated)</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="7.300s" fill="freeze"/><text y="327"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">    </tspan><tspan xml:space="preserve" fill="#a5d6ff">yk_half</tspan><tspan xml:space="preserve" fill="#e6edf3">  →  age-encrypted file on disk (YubiKey-decryptable)</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="8.300s" fill="freeze"/><text y="361"><tspan x="16.0" xml:space="preserve" fill="#d29922">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="8.600s" fill="freeze"/><text y="378"><tspan x="16.0" xml:space="preserve" fill="#d29922">TOUCH ID PROMPT INCOMING</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="8.800s" fill="freeze"/><text y="395"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  Look at your Mac — the Touch ID sheet will appear now.</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="10.300s" fill="freeze"/><text y="412"><tspan x="16.0" xml:space="preserve" fill="#d29922">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="10.600s" fill="freeze"/><text y="429"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#7ee787">✓ Touch ID accepted</tspan><tspan xml:space="preserve" fill="#e6edf3">   (kc_half written)</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="11.100s" fill="freeze"/><text y="446"><tspan x="16.0" xml:space="preserve" fill="#ff7b72">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="11.400s" fill="freeze"/><text y="463"><tspan x="16.0" xml:space="preserve" fill="#ff7b72">TAP YOUR YUBIKEY NOW</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="11.600s" fill="freeze"/><text y="480"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  The LED on your YubiKey is now flashing — tap the gold disc.</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="13.400s" fill="freeze"/><text y="497"><tspan x="16.0" xml:space="preserve" fill="#ff7b72">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text></g><g opacity="0"><set attributeName="opacity" to="1" begin="13.700s" fill="freeze"/><text y="514"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#7ee787">✓ YubiKey tap registered</tspan><tspan xml:space="preserve" fill="#e6edf3">   (yk_half written, age-encrypted)</tspan></text></g><g><rect x="16.0" y="517.0" width="8.5" height="14.0" fill="#e6edf3"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></rect></g>
</svg>
