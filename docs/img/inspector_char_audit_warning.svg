<text x="381" y="18" text-anchor="middle" fill="#8b949e" font-size="11px">local_scribe inspector • Char audit (with plaintext leftovers)</text>
<text y="55"><tspan x="16.0" xml:space="preserve" fill="#ffffff">local_scribe</tspan><tspan xml:space="preserve" fill="#e6edf3"> </tspan><tspan xml:space="preserve" fill="#8b949e">inspector</tspan><tspan xml:space="preserve" fill="#e6edf3">                              </tspan><tspan xml:space="preserve" fill="#8b949e">http://127.0.0.1:8001/</tspan></text><text y="89"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  Sessions   Config   </tspan><tspan xml:space="preserve" fill="#ffffff">Char audit</tspan><tspan xml:space="preserve" fill="#e6edf3">   About</tspan></text><text y="106"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#8b949e">──────────</tspan></text><text y="140"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#ffffff">Security verification</tspan><tspan xml:space="preserve" fill="#e6edf3">      (</tspan><tspan xml:space="preserve" fill="#79c0ff">GET /api/security/audit</tspan><tspan xml:space="preserve" fill="#e6edf3">)</tspan></text><text y="157"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#ffffff">layer                            status  summary</tspan></text><text y="174"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#8b949e">────────────────────────────────────────────────────────────────────</tspan></text><text y="191"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  SIP enforcement                  </tspan><tspan xml:space="preserve" fill="#7ee787">OK</tspan><tspan xml:space="preserve" fill="#e6edf3">      fully enabled</tspan></text><text y="208"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  Option C split-key               </tspan><tspan xml:space="preserve" fill="#7ee787">OK</tspan><tspan xml:space="preserve" fill="#e6edf3">      kc_half + yk_half present</tspan></text><text y="225"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  Encrypted vault (at-rest)        </tspan><tspan xml:space="preserve" fill="#d29922">WARN</tspan><tspan xml:space="preserve" fill="#e6edf3">    mounted, </tspan><tspan xml:space="preserve" fill="#d29922">3 plaintext copies</tspan><tspan xml:space="preserve" fill="#e6edf3"> outside vault</tspan></text><text y="242"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  Char binary integrity            </tspan><tspan xml:space="preserve" fill="#7ee787">OK</tspan><tspan xml:space="preserve" fill="#e6edf3">      CDHash matches baseline</tspan></text><text y="259"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  Signed pinned config             </tspan><tspan xml:space="preserve" fill="#7ee787">OK</tspan><tspan xml:space="preserve" fill="#e6edf3">      pinned.json + char_baseline.json</tspan></text><text y="276"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  Script integrity                 </tspan><tspan xml:space="preserve" fill="#7ee787">OK</tspan><tspan xml:space="preserve" fill="#e6edf3">      72 files match git-pinned hashes</tspan></text><text y="310"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#ffffff">Plaintext copies of Char data outside the vault</tspan></text><text y="327"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#8b949e">────────────────────────────────────────────────────────────────────</tspan></text><text y="344"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#d29922">●</tspan><tspan xml:space="preserve" fill="#e6edf3"> ~/Library/.../hyprnote.pre_vault_backup.2026-05-08  2.5 GiB  6 sessions  </tspan><tspan xml:space="preserve" fill="#ff7b72">[Delete]</tspan></text><text y="361"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#d29922">●</tspan><tspan xml:space="preserve" fill="#e6edf3"> ~/local_scribe_pre_arch_backup/hyprnote              2.5 GiB  5 sessions  </tspan><tspan xml:space="preserve" fill="#ff7b72">[Delete]</tspan></text><text y="378"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#8b949e">●</tspan><tspan xml:space="preserve" fill="#e6edf3"> ~/.cache/local_scribe-demo/hyprnote             </tspan><tspan xml:space="preserve" fill="#8b949e">2.1 MiB</tspan><tspan xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#8b949e">demo seed (informational)</tspan></text><text y="412"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#8b949e">Delete requires a typed-DELETE confirmation. The deleter refuses</tspan></text><text y="429"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#8b949e">any path not currently in the scanner&#x27;s output, so a stolen</tspan></text><text y="446"><tspan x="16.0" xml:space="preserve" fill="#e6edf3">  </tspan><tspan xml:space="preserve" fill="#8b949e">inspector bearer cannot ``rm -rf`` arbitrary directories.</tspan></text>
</svg>
